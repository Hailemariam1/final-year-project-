<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Admin</title>
</head>
<body>
    <p>Redirecting to police admin dashboard...</p>
    <script>
        // JWT segments are base64url encoded ('-' and '_' instead of '+' and '/', and
        // unpadded). Plain atob() throws on most real tokens, which previously sent every
        // authenticated officer straight back to the login page.
        function readTokenPayload(token) {
            try {
                const parts = String(token || '').split('.');
                if (parts.length !== 3) return null;
                let segment = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                while (segment.length % 4) segment += '=';
                return JSON.parse(atob(segment));
            } catch (e) {
                return null;
            }
        }

        (function () {
            const token = localStorage.getItem('token');
            const payload = token ? readTokenPayload(token) : null;

            if (!payload) {
                if (token) localStorage.removeItem('token');
                window.location.replace('../login.html');
                return;
            }

            const role = payload.user && payload.user.role;
            if (role === 'law_enforcement' || role === 'admin') {
                window.location.replace('./dashboard.html');
            } else {
                window.location.replace('../login.html');
            }
        })();
    </script>
</body>
</html>
