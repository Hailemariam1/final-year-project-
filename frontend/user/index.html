<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Area</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../mobile-menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../theme.js"></script>
</head>
<body>
    <p>Redirecting to user dashboard...</p>
    <script src="../mobile-menu.js"></script>
    <script>
        // JWT segments are base64url encoded ('-' and '_' instead of '+' and '/', and
        // unpadded). Plain atob() throws on most real tokens, which previously sent every
        // authenticated user straight back to the login page.
        function readTokenPayload(token) {
            try {
                const parts = String(token || '').split('.');
                if (parts.length !== 3) return null;
                let segment = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                while (segment.length % 4) segment += '=';
                return JSON.parse(atob(segment));
            } catch (e) {
                return null;
            }
        }

        (function () {
            const token = localStorage.getItem('token');
            const payload = token ? readTokenPayload(token) : null;

            if (!payload) {
                if (token) localStorage.removeItem('token');
                window.location.replace('../login.html');
                return;
            }

            const role = payload.user && payload.user.role;
            if (role === 'admin') {
                window.location.replace('../system_admin/index.html');
            } else if (role === 'law_enforcement') {
                window.location.replace('../police_admin/dashboard.html');
            } else {
                window.location.replace('./dashboard.html');
            }
        })();
    </script>
</body>
</html>
