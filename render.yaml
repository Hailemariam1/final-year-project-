services:
  # Backend Service (Node.js)
  - type: web
    name: missing-person-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: finalyearprojectdata-80bc9
      - key: FIREBASE_DATABASE_URL
        value: https://finalyearprojectdata-80bc9-default-rtdb.firebaseio.com
      - key: FIREBASE_STORAGE_BUCKET
        value: finalyearprojectdata-80bc9.firebasestorage.app
      - key: FIREBASE_CLIENT_EMAIL
        sync: false # Set Firebase Admin service-account client_email in Render Dashboard
      - key: FIREBASE_PRIVATE_KEY
        sync: false # Set Firebase Admin service-account private_key in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://final-year-project-frontend-silk.vercel.app
      - key: AI_SERVICE_URL
        value: https://final-year-project-0joz.onrender.com
      # System admin bootstrap (set the values in the Render dashboard)
      - key: SYSTEM_ADMIN_EMAIL
        sync: false
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false

  # AI Service (Python)
  - type: web
    name: missing-person-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    # The default 30s gunicorn timeout kills face-model warm-up requests.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 4 --access-logfile - app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
    plan: free # Note: AI models might be heavy for free tier, but good for starting
